<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş Yap | Binance TR Al-Sat Botu</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      background: #080c14 radial-gradient(circle at 50% 20%, rgba(245, 158, 11, 0.08) 0%, transparent 60%);
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      position: relative;
    }

    .login-card {
      background: rgba(18, 24, 38, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      padding: 36px 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(245, 158, 11, 0.05);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }

    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-brand-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #f59e0b, #b45309);
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 26px;
      color: #000;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.35);
      margin-bottom: 16px;
    }

    .login-title {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.3px;
      margin-bottom: 6px;
    }

    .login-subtitle {
      font-size: 13px;
      color: var(--text-muted);
    }

    .login-form .form-group {
      margin-bottom: 18px;
    }

    .login-form label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #d1d5db;
      margin-bottom: 7px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper input {
      width: 100%;
      background: rgba(10, 14, 23, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 12px 14px;
      color: #fff;
      font-size: 14px;
      transition: all 0.2s ease;
      outline: none;
    }

    .input-wrapper input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.18);
      background: rgba(10, 14, 23, 0.95);
    }

    .btn-toggle-pwd {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
    }

    .btn-login {
      width: 100%;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #000;
      border: none;
      border-radius: 10px;
      padding: 13px 18px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 24px;
    }

    .btn-login:hover {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
      transform: translateY(-1px);
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .login-error {
      display: none;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #f87171;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 18px;
      align-items: center;
      gap: 8px;
      animation: shake 0.3s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .login-footer {
      text-align: center;
      margin-top: 22px;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-brand-icon">B</div>
        <h1 class="login-title">Binance TR Al-Sat Botu</h1>
        <p class="login-subtitle">Algoritmik Takip & Risk Yönetim Paneli</p>
      </div>

      <div id="login-error" class="login-error">
        <span>⚠️</span>
        <span id="error-message">Kullanıcı adı veya parola hatalı!</span>
      </div>

      <form id="login-form" class="login-form">
        <div class="form-group">
          <label for="username">Kullanıcı Adı</label>
          <div class="input-wrapper">
            <input type="text" id="username" name="username" placeholder="Kullanıcı adınızı girin" required autocomplete="username" autofocus>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Parola</label>
          <div class="input-wrapper">
            <input type="password" id="password" name="password" placeholder="Parolanızı girin" required autocomplete="current-password">
            <button type="button" id="btn-toggle-pwd" class="btn-toggle-pwd" title="Parolayı Göster/Gizle">👁️</button>
          </div>
        </div>

        <button type="submit" id="btn-submit" class="btn-login">
          <span>Giriş Yap</span>
          <span id="login-spinner" style="display: none;">⏳</span>
        </button>
      </form>

      <div class="login-footer">
        <span>🔒</span>
        <span>Config Tabanlı Güvenli Oturum</span>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById("login-form");
    const errorBox = document.getElementById("login-error");
    const errorMsg = document.getElementById("error-message");
    const btnSubmit = document.getElementById("btn-submit");
    const spinner = document.getElementById("login-spinner");
    const pwdInput = document.getElementById("password");
    const togglePwd = document.getElementById("btn-toggle-pwd");

    togglePwd.addEventListener("click", () => {
      if (pwdInput.type === "password") {
        pwdInput.type = "text";
        togglePwd.innerText = "🙈";
      } else {
        pwdInput.type = "password";
        togglePwd.innerText = "👁️";
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.style.display = "none";
      btnSubmit.disabled = true;
      spinner.style.display = "inline";

      const username = document.getElementById("username").value.trim();
      const password = pwdInput.value;

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (res.ok && data.status === "success") {
          window.location.href = "/";
        } else {
          errorMsg.innerText = data.message || "Giriş başarısız. Lütfen bilgilerinizi kontrol edin.";
          errorBox.style.display = "flex";
        }
      } catch (err) {
        errorMsg.innerText = "Sunucuya bağlanılamadı: " + err;
        errorBox.style.display = "flex";
      } finally {
        btnSubmit.disabled = false;
        spinner.style.display = "none";
      }
    });
  </script>
</body>
</html>
