# ==============================================================================
# Binance TR Al-Sat Botu - Genel Yapılandırma Şablonu
# ==============================================================================
# Test için: config.test.example.yaml -> config.test.yaml
# Canlı için: config.live.example.yaml -> config.live.yaml
# ==============================================================================

api:
  api_key: ""
  secret_key: ""
  base_url: "https://www.binance.tr"
  ws_url: "wss://stream-cloud.binance.tr/ws"

auth:
  enabled: true
  username: "admin"
  password: "admin123"

server:
  host: "0.0.0.0"
  port: 8000

trading:
  mode: "simulation"               # "simulation" veya "live"
  symbol: "AUTO"
  auto_select_coin: true
  target_coins_count: 5
  max_open_positions: 5
  auto_fill_portfolio: true
  top_coins_limit: 15
  budget_per_trade: 2000.0
  initial_virtual_balance: 10000.0
  candidate_observation_seconds: 45
  filter_falling_coins: true
  only_uptrend: true
  min_24h_gain_pct: 0.0
  fee_rate_pct: 0.1

strategy:
  active: "adaptive_regime"
  take_profit_pct: 1.8
  stop_loss_pct: 1.0
  trailing_activation_pct: 0.8
  trailing_stop_pct: 0.6
  cooldown_seconds: 10
  symbol_cooldown_seconds: 60
  rsi_period: 14
  rsi_oversold: 35.0
  rsi_overbought: 65.0
  bollinger_period: 20
  bollinger_std_dev: 2.0
  ema_fast: 9
  ema_slow: 21

test:
  duration_minutes: 15
  auto_stop: true
